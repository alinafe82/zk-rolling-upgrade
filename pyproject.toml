[project]
name = "zk-rolling-upgrade"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.4.2",
    "pydantic>=2.13.4",
    "rich>=15.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
